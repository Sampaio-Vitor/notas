<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notas">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/vendor/framework7.css">
<link rel="stylesheet" href="/style.css">
<title>Notas</title>
</head>
<body>
<div id="app">
  <div class="view view-main">
    <div class="page" data-name="root">
      <div class="page-content"><main class="n-screen"></main></div>
    </div>
  </div>
  <template id="sub-template">
    <div class="page" data-name="sub">
      <div class="page-content"><main class="n-screen"></main></div>
      <div class="n-page-action"></div>
    </div>
  </template>
  <div id="float" class="n-float"></div>
  <nav id="tabbar" class="n-tabbar" aria-label="Seções do app"></nav>
  <dialog id="sheet" class="n-sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
  <div id="toast" class="n-toast" role="status" aria-live="polite"></div>
  <div id="finder" class="d-finder" hidden></div>
  <div id="ctx" class="d-ctx" role="menu" aria-label="Ações" tabindex="-1" hidden></div>
  <div id="meeting-pop" class="d-pop" role="dialog" aria-label="Detalhes da reunião" tabindex="-1" hidden></div>
</div>
<script src="/vendor/framework7.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
