services:
  notas:
    image: ${NOTAS_IMAGE:-notas:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOTAS_PORT:-4329}:4329"
    environment:
      # Uma pessoa por entrada: id:Nome:senha, separadas por vírgula.
      APP_USERS: ${APP_USERS:-}
      # Alternativa com uma pessoa só.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Agentes no /mcp: id:token (só a lista de compras) ou id:token:pessoa (também as tarefas,
      # as contas e as notas dessa pessoa), separados por vírgula.
      MCP_TOKENS: ${MCP_TOKENS:-}
      # Como cada agente aparece no app (opcional): id:Nome, separados por vírgula.
      MCP_AGENT_NAMES: ${MCP_AGENT_NAMES:-}
      # Faturas de cartão do app de finanças, pela rede notas-financas (vazio = desligado).
      FINANCE_URL: ${FINANCE_URL:-}
      FINANCE_TOKEN: ${FINANCE_TOKEN:-}
      FINANCE_USER: ${FINANCE_USER:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN com o endereço HTTPS}
      # Contato enviado aos serviços de push (opcional; padrão: PUBLIC_ORIGIN).
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # A porta só existe no loopback: todo acesso passa pelo proxy HTTPS local.
      TRUST_PROXY: "1"
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4329/healthz').then(async r=>{if(!r.ok || !(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    volumes:
      - notas-data:/app/data
    networks: [default, financas]
networks:
  # Só o notas e o backend do app de finanças: o MySQL e o Redis dele ficam de fora.
  # Criada por este projeto; o financial-system a usa como externa.
  financas:
    name: notas-financas
volumes:
  notas-data:
