services:
  notas:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4329:4329"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Defina APP_PASSWORD no .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN com o endereço HTTPS}
      TZ: America/Sao_Paulo
    volumes:
      - notas-data:/app/data
volumes:
  notas-data:
